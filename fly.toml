app = "kaspi-feed"
primary_region = "waw"

[build]

[env]
  PORT = "8080"
  REBUILD_MINUTES = "15"

[http_service]
  internal_port = 8080
  force_https = true
  # Машина не должна засыпать: Kaspi ходит по ссылке раз в час,
  # а холодный старт отдаст 503 вместо файла.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "60s"
  timeout = "10s"
